version: '3.8'

services:
  # Master Orchestrator - FastAPI Hub
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ultimate-mcp-orchestrator
    ports:
      - "7860:7860"
    environment:
      - PYTHONUNBUFFERED=1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - N8N_API_KEY=${N8N_API_KEY}
      - N8N_BASE_URL=${N8N_BASE_URL:-http://localhost:5678}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}
    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs
      - ./.env:/app/.env
    command: python backend/main.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mcp-network
    restart: unless-stopped

  # N8N Automation MCP Server
  n8n-automation:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ultimate-mcp-n8n
    ports:
      - "7862:7862"
    environment:
      - PYTHONUNBUFFERED=1
      - N8N_API_KEY=${N8N_API_KEY}
      - N8N_BASE_URL=${N8N_BASE_URL:-http://localhost:5678}
    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs
    command: python backend/mcp_servers/n8n_automation/server.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7862"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mcp-network
    depends_on:
      - orchestrator
    restart: unless-stopped

  # Agent Builder MCP Server
  agent-builder:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ultimate-mcp-agent-builder
    ports:
      - "7863:7863"
    environment:
      - PYTHONUNBUFFERED=1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}
    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs
    command: python backend/mcp_servers/agent_builder/server.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7863"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mcp-network
    depends_on:
      - orchestrator
    restart: unless-stopped

  # Local Control MCP Server
  local-control:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ultimate-mcp-local-control
    ports:
      - "7864:7864"
    environment:
      - PYTHONUNBUFFERED=1
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs
      - /tmp:/tmp  # For file operations
    command: python backend/mcp_servers/local_control/server.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7864"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mcp-network
    depends_on:
      - orchestrator
    restart: unless-stopped
    privileged: true  # Required for browser automation

networks:
  mcp-network:
    driver: bridge

volumes:
  logs:
    driver: local
