services:
  agent-builder:
    build:
      context: ../../..
      dockerfile: backend/mcp_servers/agent_builder/Dockerfile
    container_name: agent-builder-mcp
    env_file:
      - ../../../.env
    ports:
      - "7863:7863"
    environment:
      # Google Cloud / Gemini
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-stellar-state-471406-f8}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GENERATIVE_LANGUAGE_API_KEY=${GENERATIVE_LANGUAGE_API_KEY}
      
      # Composio Integration
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}
      - COMPOSIO_MCP_ENDPOINT=${COMPOSIO_MCP_ENDPOINT}
      - COMPOSIO_USER_ID=${COMPOSIO_USER_ID}
      
      # Optional: Other AI providers
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      
      # N8N Integration (optional)
      - N8N_API_URL=${N8N_API_URL}
      - N8N_API_KEY=${N8N_API_KEY}
    volumes:
      # Mount logs directory to persist logs
      - ./logs:/app/backend/logs
      # Mount code for development (comment out for production)
      - ../../..:/app
    restart: unless-stopped
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
